name: Morning Signal 자동 갱신

"on":
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Asia/Seoul'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: morning-signal-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6

      - name: Python 준비
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 오늘 브리핑 생성
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash-lite' }}
          NEWS_HOURS: '40'
          MAX_ARTICLES: '70'
        run: python scripts/generate_briefing.py

      - name: 날짜별 브리핑 저장
        run: |
          git config user.name "morning-signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "변경된 브리핑이 없습니다."
          else
            git commit -m "chore: update morning signal $(date -u +%F)"
            git push
          fi

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v5

      - name: 정적 사이트 묶기
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
